# .goreleaser.yaml
# Cross-compilation, GitHub Release, and Homebrew tap automation for FlowPilot
version: 2

project_name: flowpilot

before:
  hooks:
    - go mod tidy -C apps/local-runner

builds:
  - id: flowpilot
    dir: apps/local-runner
    main: ./cmd/flowpilot
    binary: flowpilot
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: flowpilot-archive
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

brews:
  - name: flowpilot
    repository:
      owner: dattien96
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/dattien96/flowpilot"
    description: "FlowPilot — The AI-Assisted Engineering Harness & Gated Workflow Platform"
    license: "MIT"
    install: |
      bin.install "flowpilot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "merge conflict"
      - "Merge pull request"
