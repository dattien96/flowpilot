id: rag-harness
version: 1
description: Flow Mode Plan-to-Code-to-Test-to-Audit template without hardcoded step names.
mode: flow
builtin:
  editable: false
  chatBaseline: true
  selectableIn:
    - flow
  cloneable: true
  mirror:
    required: true
    source: builtin
policy:
  cap: 3
  onCap: escalate
  extendBy: 2
  extendMax: 2
contexts:
  main_context:
    ref: contexts/flow-context-package.yaml
nodes:
  - id: context
    run: inline
    lifecycle: once
    behavior: context.produce
    outputs:
      main_context: flow_context_package.v1
  - id: implement
    run: delegate
    lifecycle: reinvoke
    behavior: agent.delegate
    agent: agents/coder.md
    inputs:
      main_context: flow_context_package.v1
    promptTemplate: prompts/flow-context-handoff.md
  - id: validate
    run: inline
    lifecycle: once
    behavior: command.validate
    inputs:
      main_context: flow_context_package.v1
    outputs:
      validation_result: validation_result.v1
      validation_retry: validation_retry.v1
  - id: audit
    run: inline
    lifecycle: once
    behavior: artifact.audit_draft
    inputs:
      main_context: flow_context_package.v1
      validation_result: validation_result.v1
edges:
  - from: context
    to: implement
    when: done
    kind: forward
  - from: implement
    to: validate
    when: done
    kind: forward
  - from: validate
    to: implement
    when: continue
    kind: back
  - from: validate
    to: audit
    when: done
    kind: forward
  - from: validate
    to: ask_user
    when: escalate
    kind: forward
  - from: audit
    to: done
    when: done
    kind: forward
