id: rag-harness
version: 1
description: Flow Mode Plan-to-Code-to-Test-to-Audit template without hardcoded step names.
mode: flow
builtin:
  editable: false
  chatBaseline: true
  selectableIn:
    - flow
  cloneable: true
  mirror:
    required: true
    source: builtin
policy:
  cap: 3
  onCap: escalate
  extendBy: 2
  extendMax: 2
contexts:
  main_context:
    ref: contexts/flow-context-package.yaml
    # CP-44 P-4/Task-194: explicit enabled-source declaration. Lists the same
    # 3 built-in sources the runner defaults to when a flow declares none, so
    # this is documentation-as-config, not a behavior change. Add a source id
    # here (once registered in the runner) to extend this flow's context
    # harness without touching Go code.
    sources:
      - feature.history
      - chat.summary
      - source.excerpt
nodes:
  - id: context
    run: inline
    lifecycle: once
    behavior: context.produce
  - id: implement
    run: delegate
    lifecycle: reinvoke
    behavior: agent.delegate
    agent: agents/coder.md
    promptTemplate: prompts/flow-context-handoff.md
  - id: validate
    run: inline
    lifecycle: once
    behavior: command.validate
  - id: audit
    run: inline
    lifecycle: once
    behavior: artifact.audit_draft
edges:
  - from: context
    to: implement
    when: done
    kind: forward
  - from: implement
    to: validate
    when: done
    kind: forward
  - from: validate
    to: implement
    when: continue
    kind: back
  - from: validate
    to: audit
    when: done
    kind: forward
  - from: validate
    to: ask_user
    when: escalate
    kind: forward
  - from: audit
    to: done
    when: done
    kind: forward
