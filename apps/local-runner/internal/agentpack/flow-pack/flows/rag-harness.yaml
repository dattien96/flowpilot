id: rag-harness
version: 1
description: Flow Mode Plan-to-Code-to-Test-to-Audit template without hardcoded step names.
mode: flow
builtin:
  editable: false
  chatBaseline: true
  selectableIn:
    - flow
  cloneable: true
  mirror:
    required: true
    source: builtin
policy:
  cap: 3
  onCap: escalate
  extendBy: 2
  extendMax: 2
contexts:
  main_context:
    ref: contexts/flow-context-package.yaml
    # CP-44 P-4/Task-194: explicit enabled-source declaration. CP-55 P-8 added
    # change.contract/canonical.head so this flow's default context package
    # exposes the frozen preflight contract and Canonical Head sections
    # (spec 3.15) alongside the 3 sources the runner already defaulted to.
    sources:
      - change.contract
      - canonical.head
      - feature.history
      - chat.summary
      - source.excerpt
acceptance_nodes:
  - validate
  - audit
nodes:
  - id: preflight_contract_plan
    run: delegate
    lifecycle: once
    behavior: agent.delegate
    agent: agents/contract-planner.md
  - id: preflight_contract_freeze
    run: inline
    lifecycle: once
    behavior: contract.freeze
  - id: context
    run: inline
    lifecycle: once
    behavior: context.produce
  - id: implement
    run: delegate
    lifecycle: reinvoke
    behavior: agent.code
    agent: agents/coder.md
    promptTemplate: prompts/flow-context-handoff.md
  - id: validate
    run: inline
    lifecycle: once
    behavior: command.validate
  - id: audit
    run: inline
    lifecycle: once
    behavior: artifact.audit_draft
edges:
  - from: preflight_contract_plan
    to: preflight_contract_freeze
    when: done
    kind: forward
  - from: preflight_contract_freeze
    to: context
    when: done
    kind: forward
  - from: context
    to: implement
    when: done
    kind: forward
  - from: implement
    to: validate
    when: done
    kind: forward
  - from: validate
    to: implement
    when: continue
    kind: back
  - from: validate
    to: audit
    when: done
    kind: forward
  - from: validate
    to: ask_user
    when: escalate
    kind: forward
  - from: audit
    to: done
    when: done
    kind: forward
