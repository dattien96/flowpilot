id: vibe-sprint
version: "2"
description: Vibe per-sprint v2 — freeze, context, TDD, code, validate, synthesis, audit. Owners are NOT graph nodes; non-requirement gate fails are auto-resolved by the resolver invoking vibe-owner-debate (cap 5, vibe-only).
mode: flow
builtin:
  editable: false
  selectableIn: []
  cloneable: false
  mirror:
    required: true
    source: builtin
policy:
  cap: 3
  onCap: escalate
  extendBy: 2
  extendMax: 2
  # CP-67 P-5 (B-10): phase-scoped signature-renegotiation budget — never
  # shared with the review-loop cap; escalate when exhausted (no extend).
  negotiationCap: 5
tools:
  - tools/vibe-requirement-outcome.yaml
  # CP-67 P-5 (Task-378): Contract-First TDD handover faces.
  - tools/submit-scaffold-outcome.yaml
  - tools/submit-coder-outcome.yaml
# CP-62 P-5 (Task-341): vibe-sprint profiles — tdd/coder see the SS slice +
# dependence; the previous sprint's handoff (P-6) rides the pack when present.
contextProfiles:
  scout:
    candidateSources: [conventions, canonical.head, feature.history]
    maxTokens: 6000
  coder:
    candidateSources: [conventions, canonical.head, change.contract, source.dependence, source.excerpt]
    maxTokens: 24000
  tdd:
    candidateSources: [conventions, canonical.head, change.contract, source.excerpt]
    maxTokens: 12000
acceptance_nodes:
  - validate
  - synthesis
  - audit
nodes:
  - id: preflight_contract_plan
    run: delegate
    lifecycle: once
    behavior: agent.delegate
    agent: agents/contract-planner.md
    # CP-62 P-4 (Task-340): scout is read-only (BUG-344 classifier).
    posture: read_only
    contextProfile: scout
  - id: preflight_contract_freeze
    run: inline
    lifecycle: once
    behavior: contract.freeze
  - id: context
    run: inline
    lifecycle: once
    behavior: context.produce
  - id: tdd
    run: delegate
    # CP-67 P-5 (B-7): node id UNCHANGED. Contract-First Scaffold TDD wiring;
    # lifecycle stays reinvoke for negotiation re-entry.
    lifecycle: reinvoke
    behavior: agent.scaffold
    agent: agents/scaffold-architect.md
    promptTemplate: prompts/scaffold-contract-tdd.md
    join: all
    # CP-67 P-3 (B-5): the contract architect is a High-Reasoning tier node.
    model: claude-sonnet-4-5
    contextProfile: tdd
    artifactBindings:
      - direction: output
        slotName: tdd_signatures
        artifactInstanceId: tdd_signatures
        artifactTypeId: file_artifact.v1
        required: true
        position: 0
        config:
          pathTemplate: requirements/.flowpilot/vibe/tdd-signatures.md
  - id: coder
    run: delegate
    lifecycle: reinvoke
    behavior: agent.code
    agent: agents/coder.md
    # CP-67 P-5 (Task-381): fill-body-only contract with Accumulate & Batch.
    promptTemplate: prompts/implement-scaffold-body.md
    join: all
    contextProfile: coder
  - id: validate
    run: inline
    lifecycle: once
    behavior: command.validate
  - id: synthesis
    run: inline
    lifecycle: reinvoke
    behavior: hub.inline
    agent: agents/synthesizer.md
    join: all
  # CP-67 P-5 (B-6): the signature-renegotiation hub — adjudicates the
  # coder's batch, routes scaffold revision or closure. Inline hub.
  - id: synthesis_negotiation
    run: inline
    lifecycle: reinvoke
    behavior: hub.inline
    agent: agents/synthesizer.md
    join: all
  - id: audit
    run: inline
    lifecycle: once
    behavior: artifact.audit_draft
edges:
  - from: preflight_contract_plan
    to: preflight_contract_freeze
    when: done
    kind: forward
  - from: preflight_contract_freeze
    to: context
    when: done
    kind: forward
  - from: context
    to: tdd
    when: done
    kind: forward
  - from: tdd
    to: coder
    when: done
    kind: forward
  - from: coder
    to: validate
    when: done
    kind: forward
  - from: validate
    to: synthesis
    when: done
    kind: forward
  - from: validate
    to: ask_user
    when: escalate
    kind: forward
  - from: synthesis
    to: coder
    when: continue
    kind: back
  # CP-67 P-5 (B-6): review-loop edge synthesis -> coder (continue/back) is
  # UNCHANGED; renegotiation routes through synthesis_negotiation instead.
  - from: synthesis
    to: synthesis_negotiation
    when: continue
    kind: forward
  - from: synthesis_negotiation
    to: tdd
    when: continue
    kind: back
  - from: synthesis_negotiation
    to: synthesis
    when: done
    kind: forward
  - from: synthesis
    to: audit
    when: done
    kind: forward
  - from: synthesis
    to: ask_user
    when: escalate
    kind: forward
  - from: audit
    to: done
    when: done
    kind: forward
