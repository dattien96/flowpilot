id: vibe-sprint
version: "2"
description: Vibe per-sprint v2 — freeze, context, TDD, code, validate, synthesis, audit. Owners are NOT graph nodes; non-requirement gate fails are auto-resolved by the resolver invoking vibe-owner-debate (cap 5, vibe-only).
mode: flow
builtin:
  editable: false
  selectableIn: []
  cloneable: false
  mirror:
    required: true
    source: builtin
policy:
  cap: 3
  onCap: escalate
  extendBy: 2
  extendMax: 2
tools:
  - tools/vibe-requirement-outcome.yaml
acceptance_nodes:
  - validate
  - synthesis
  - audit
nodes:
  - id: preflight_contract_plan
    run: delegate
    lifecycle: once
    behavior: agent.delegate
    agent: agents/contract-planner.md
  - id: preflight_contract_freeze
    run: inline
    lifecycle: once
    behavior: contract.freeze
  - id: context
    run: inline
    lifecycle: once
    behavior: context.produce
  - id: tdd
    run: delegate
    lifecycle: reinvoke
    behavior: agent.code
    agent: agents/tester.md
    promptTemplate: prompts/test-signatures.md
    join: all
    artifactBindings:
      - direction: output
        slotName: tdd_signatures
        artifactInstanceId: tdd_signatures
        artifactTypeId: file_artifact.v1
        required: true
        position: 0
        config:
          pathTemplate: requirements/.flowpilot/vibe/tdd-signatures.md
  - id: coder
    run: delegate
    lifecycle: reinvoke
    behavior: agent.code
    agent: agents/coder.md
    promptTemplate: prompts/implement-complete-tests.md
    join: all
  - id: validate
    run: inline
    lifecycle: once
    behavior: command.validate
  - id: synthesis
    run: inline
    lifecycle: reinvoke
    behavior: hub.inline
    agent: agents/synthesizer.md
    join: all
  - id: audit
    run: inline
    lifecycle: once
    behavior: artifact.audit_draft
edges:
  - from: preflight_contract_plan
    to: preflight_contract_freeze
    when: done
    kind: forward
  - from: preflight_contract_freeze
    to: context
    when: done
    kind: forward
  - from: context
    to: tdd
    when: done
    kind: forward
  - from: tdd
    to: coder
    when: done
    kind: forward
  - from: coder
    to: validate
    when: done
    kind: forward
  - from: validate
    to: synthesis
    when: done
    kind: forward
  - from: validate
    to: ask_user
    when: escalate
    kind: forward
  - from: synthesis
    to: coder
    when: continue
    kind: back
  - from: synthesis
    to: audit
    when: done
    kind: forward
  - from: synthesis
    to: ask_user
    when: escalate
    kind: forward
  - from: audit
    to: done
    when: done
    kind: forward
