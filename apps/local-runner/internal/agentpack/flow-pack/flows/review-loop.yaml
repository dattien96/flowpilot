id: review-loop
version: 1
description: Chat-mode review-until-clean template over the generic flow executor.
mode: chat
builtin:
  editable: false
  # Hidden from the /flow picker and the Chat Bug orchestration picker
  # (rag-harness pattern): the review-until-clean loop now lives inside the
  # harness flows (task/bug-plan/cp), so this template stays as a cloneable
  # reference only.
  selectableIn: []
  cloneable: true
  mirror:
    required: true
    source: builtin
policy:
  cap: 3
  onCap: escalate
  extendBy: 2
  extendMax: 2
tools:
  - tools/submit-review-outcome.yaml
acceptance_nodes:
  - synthesis
nodes:
  - id: preflight_contract_plan
    run: delegate
    lifecycle: once
    behavior: agent.delegate
    agent: agents/contract-planner.md
  - id: preflight_contract_freeze
    run: inline
    lifecycle: once
    behavior: contract.freeze
  - id: coder
    run: delegate
    lifecycle: reinvoke
    behavior: agent.code
    agent: agents/coder.md
    join: all
  - id: reviewer_correctness
    run: delegate
    lifecycle: spawn
    behavior: agent.delegate
    agent: agents/reviewer.md
    dependsOn:
      - coder
    cohort: review
    join: all
  - id: reviewer_security
    run: delegate
    lifecycle: spawn
    behavior: agent.delegate
    agent: agents/reviewer.md
    dependsOn:
      - coder
    cohort: review
    join: all
  - id: synthesis
    run: inline
    lifecycle: reinvoke
    behavior: hub.inline
    agent: agents/synthesizer.md
    join: all
edges:
  - from: preflight_contract_plan
    to: preflight_contract_freeze
    when: done
    kind: forward
  - from: preflight_contract_freeze
    to: coder
    when: done
    kind: forward
  - from: coder
    to: reviewer_correctness
    when: done
    kind: forward
  - from: coder
    to: reviewer_security
    when: done
    kind: forward
  - from: reviewer_correctness
    to: synthesis
    when: done
    kind: forward
  - from: reviewer_security
    to: synthesis
    when: done
    kind: forward
  - from: synthesis
    to: coder
    when: continue
    kind: back
  - from: synthesis
    to: done
    when: done
    kind: forward
  - from: synthesis
    to: ask_user
    when: escalate
    kind: forward
