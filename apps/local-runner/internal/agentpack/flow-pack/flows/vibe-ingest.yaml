id: vibe-ingest
version: "1"
description: Vibe ingest — raw idea to SS lock, write one CP, then join vibe-cp-ingest at task_slicer (skip CP read/lock).
mode: flow
builtin:
  editable: false
  selectableIn: []
  cloneable: false
  mirror:
    required: true
    source: builtin
policy:
  cap: 3
  onCap: escalate
  extendBy: 2
  extendMax: 2
acceptance_nodes: []
nodes:
  - id: ingest_reader
    run: delegate
    lifecycle: once
    behavior: agent.delegate
    agent: agents/vibe-intake.md
    promptTemplate: prompts/vibe-ss-ingest.md
    join: all
  - id: ss_converter
    run: delegate
    lifecycle: once
    behavior: agent.delegate
    agent: agents/vibe-intake.md
    promptTemplate: prompts/vibe-ss-ingest.md
    join: all
  - id: ss_validator
    run: inline
    lifecycle: once
    behavior: hub.inline
    agent: agents/synthesizer.md
    promptTemplate: prompts/vibe-ss-validate.md
    join: all
  - id: ss_lock
    run: inline
    lifecycle: once
    behavior: user.confirm
    join: all
  - id: cp_writer
    run: delegate
    lifecycle: once
    behavior: agent.delegate
    agent: agents/doc-writer.md
    promptTemplate: prompts/vibe-cp-from-ss.md
    join: all
    artifactBindings:
      - direction: output
        slotName: cp_md
        artifactInstanceId: cp_md
        artifactTypeId: file_artifact.v1
        required: true
        position: 0
        config:
          pathTemplate: requirements/07-Coding-Plan/todo/CP-{{cpID}}-{{slug}}.md
edges:
  - from: ingest_reader
    to: ss_converter
    when: done
    kind: forward
  - from: ss_converter
    to: ss_validator
    when: done
    kind: forward
  - from: ss_validator
    to: ss_lock
    when: done
    kind: forward
  - from: ss_validator
    to: ss_converter
    when: continue
    kind: back
  - from: ss_lock
    to: cp_writer
    when: done
    kind: forward
  - from: ss_lock
    to: ask_user
    when: escalate
    kind: forward
  - from: cp_writer
    to: done
    when: done
    kind: forward
  - from: cp_writer
    to: ask_user
    when: escalate
    kind: forward
