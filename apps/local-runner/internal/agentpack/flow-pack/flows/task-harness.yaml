# task-harness: CP-58 Task-305 Tier-2 harness for a normal Task (1-3d, needs
# HLD/LLD). Plan review loop FIRST (plan_writer -> plan_reviewer ->
# plan_synthesis, continue/back re-entry), scope freeze ONLY after the plan is
# approved, then the rag-harness code chain (test_signatures -> implement ->
# validate -> reviewer -> synthesis -> audit). Two continue back-edges are
# legal since CP-58 Task-304 keyed the validator on (from,when).
#
# NOTE (Task-305 deviation, see Completion Notes): plan_writer is
# agent.delegate + lifecycle:reinvoke, not agent.code. CP-55 P-1
# ValidateFlowSafetyTopology requires every agent.code writer to be dominated
# by a contract.freeze node, and plan_writer must run BEFORE freeze (the
# freeze locks the approved plan). agent.code and agent.delegate share the
# same handler verbatim, and the file_artifact write contract keys on the
# node's artifactBindings, so the delegate behavior keeps the runtime
# semantics while real code writers (test_signatures, implement) stay
# agent.code under the CP-55 safety contract.
id: task-harness
version: 1
description: Task (1-3d feature slice) - Plan Writer + Plan Review Loop + scope freeze + TDD + Code Review Loop.
mode: flow
builtin:
  editable: false
  selectableIn:
    - flow
  cloneable: true
  mirror:
    required: true
    source: builtin
policy:
  # Dual-loop flow (plan review + code review share one Round budget, reset
  # when the plan approves): cap 5 per phase instead of 3, so a contested
  # plan cannot starve the code review loop.
  cap: 5
  onCap: escalate
  extendBy: 2
  extendMax: 2
contexts:
  main_context:
    ref: contexts/flow-context-package.yaml
    sources:
      - canonical.head
      - feature.history
      - change.contract
      - source.dependence
      - chat.summary
      - source.excerpt
# CP-62 P-5 (Task-341): per-node context profiles — candidate source set +
# token budget, layered ON TOP of the Budget Packer (CP-23). Nodes reference
# these by name; a node without a profile falls back to main_context.
contextProfiles:
  scout:
    candidateSources: [conventions, knowledge.flow, canonical.head, feature.history]
    maxTokens: 6000
  plan_writer:
    candidateSources: [conventions, knowledge.flow, canonical.head, feature.history, change.contract, source.excerpt]
    maxTokens: 16000
  reviewer:
    candidateSources: [conventions, change.contract, source.excerpt]
    maxTokens: 12000
  coder:
    candidateSources: [conventions, canonical.head, change.contract, source.dependence, source.excerpt]
    maxTokens: 24000
tools:
  - tools/submit-review-outcome.yaml
acceptance_nodes:
  - plan_synthesis
  - validate
  - synthesis
  - audit
nodes:
  # --- Scout (fast/cheap model tier, broad context) ---
  - id: preflight_contract_plan
    run: delegate
    lifecycle: once
    behavior: agent.delegate
    agent: agents/contract-planner.md
    promptTemplate: prompts/plan-safe-fix-contract.md
    # CP-62 P-4 (Task-340): the scout only reads and plans — structurally
    # gated read-only at the approval bridge (BUG-344 classifier).
    posture: read_only
    # CP-62 P-5 (Task-341): broad-and-cheap context (CP-23 budget profile).
    contextProfile: scout
  # --- Draft context (code excerpts feed plan_writer) ---
  - id: context
    run: inline
    lifecycle: once
    behavior: context.produce
  # --- Plan phase (high-reasoning model, 3-layer defense) ---
  - id: plan_writer
    run: delegate
    lifecycle: reinvoke
    behavior: agent.delegate
    agent: agents/doc-writer.md
    promptTemplate: prompts/plan-task.md
    # CP-62 P-5 (Task-341): plan writer needs excerpts to plan from.
    contextProfile: plan_writer
    artifactBindings:
      # CP-58 Task-307: the plan md is a typed file_artifact OUTPUT slot. The
      # pathTemplate is resolved by the writer at authoring time ({{idx}} =
      # next free Task number, {{slug}} = short slug); it is prompt-contract
      # only and deliberately NOT part of the flowgate exact-path check.
      - direction: output
        slotName: plan_md
        artifactInstanceId: plan_md
        artifactTypeId: file_artifact.v1
        required: true
        position: 0
        config:
          pathTemplate: requirements/08-Task/todo/Task-{{idx}}-{{slug}}.md
  - id: plan_reviewer
    run: delegate
    lifecycle: spawn
    behavior: agent.delegate
    agent: agents/reviewer.md
    promptTemplate: prompts/review-plan.md
    # CP-62 P-4 (Task-340): reviewers are read-only + verdict face — the
    # oracle rule (SS-14 AC-6) becomes structural, not prompted.
    posture: read_only
    # CP-62 P-5 (Task-341): reviewer sees contract + excerpts, not dependence.
    contextProfile: reviewer
    dependsOn:
      - plan_writer
    cohort: plan
    join: all
    artifactBindings:
      - direction: input
        slotName: plan_md
        artifactInstanceId: plan_md
        artifactTypeId: file_artifact.v1
        required: true
        position: 0
        config:
          pathTemplate: requirements/08-Task/todo/Task-{{idx}}-{{slug}}.md
  - id: plan_synthesis
    run: inline
    lifecycle: reinvoke
    behavior: hub.inline
    agent: agents/synthesizer.md
    join: all
  # --- Scope lock (runs ONLY after plan_synthesis approves) ---
  - id: preflight_contract_freeze
    run: inline
    lifecycle: once
    behavior: contract.freeze
  # --- Code phase (identical shape to rag-harness) ---
  - id: test_signatures
    run: delegate
    lifecycle: once
    behavior: agent.code
    agent: agents/tester.md
    promptTemplate: prompts/test-signatures.md
  - id: implement
    run: delegate
    lifecycle: reinvoke
    behavior: agent.code
    agent: agents/coder.md
    promptTemplate: prompts/implement-complete-tests.md
    # CP-62 P-5 (Task-341): coder needs the full dependence chain.
    contextProfile: coder
  - id: validate
    run: inline
    lifecycle: once
    behavior: command.validate
  - id: reviewer
    run: delegate
    lifecycle: spawn
    behavior: agent.delegate
    agent: agents/reviewer.md
    promptTemplate: prompts/review-safe-fix-contract.md
    # CP-62 P-4 (Task-340): read-only reviewer — no write path to weaken a
    # test (SS-14 AC-6 enforced by the approval bridge, not the prompt).
    posture: read_only
    # CP-62 P-5 (Task-341): reviewer profile.
    contextProfile: reviewer
    dependsOn:
      - validate
    cohort: review
    join: all
  - id: synthesis
    run: inline
    lifecycle: reinvoke
    behavior: hub.inline
    agent: agents/synthesizer.md
    join: all
  - id: audit
    run: inline
    lifecycle: once
    behavior: artifact.audit_draft
edges:
  # --- Scout -> Draft Context -> Plan loop ---
  - from: preflight_contract_plan
    to: context
    when: done
    kind: forward
  - from: context
    to: plan_writer
    when: done
    kind: forward
  - from: plan_writer
    to: plan_reviewer
    when: done
    kind: forward
  - from: plan_reviewer
    to: plan_synthesis
    when: done
    kind: forward
  # LOOP 1 back-edge: plan review changes_requested re-enters plan_writer.
  - from: plan_synthesis
    to: plan_writer
    when: continue
    kind: back
  # --- Plan approved -> Freeze scope -> Code ---
  - from: plan_synthesis
    to: preflight_contract_freeze
    when: done
    kind: forward
  - from: preflight_contract_freeze
    to: test_signatures
    when: done
    kind: forward
  - from: test_signatures
    to: implement
    when: done
    kind: forward
  # --- Code loop (identical edges to rag-harness) ---
  - from: implement
    to: validate
    when: done
    kind: forward
  # LOOP 2 back-edge: validate retries and the synthesis hub's
  # changes_requested share this edge (rag-harness semantics).
  - from: validate
    to: implement
    when: continue
    kind: back
  - from: validate
    to: reviewer
    when: done
    kind: forward
  - from: validate
    to: ask_user
    when: escalate
    kind: forward
  - from: reviewer
    to: synthesis
    when: done
    kind: forward
  - from: synthesis
    to: audit
    when: done
    kind: forward
  - from: synthesis
    to: ask_user
    when: escalate
    kind: forward
  - from: audit
    to: done
    when: done
    kind: forward
