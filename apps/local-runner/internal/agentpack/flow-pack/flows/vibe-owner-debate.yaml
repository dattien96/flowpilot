id: vibe-owner-debate
version: "1"
description: Vibe gate Owner debate — two isolated owners decide the next remediation; cap 5, then escalate to user. Invoked only by the gate resolver for non-r-requirement violations in working_mode=vibe.
mode: flow
builtin:
  editable: false
  selectableIn: []
  cloneable: false
  mirror:
    required: true
    source: builtin
policy:
  cap: 5
  onCap: escalate
  extendBy: 2
  extendMax: 2
tools:
  - tools/submit-review-outcome.yaml
acceptance_nodes: []
nodes:
  - id: debate_trigger
    run: inline
    lifecycle: reinvoke
    behavior: hub.inline
    agent: agents/synthesizer.md
    join: all
  - id: owner_1
    run: delegate
    lifecycle: spawn
    behavior: agent.delegate
    workloadClass: high_reasoning
    agent: agents/owner.md
    # CP-62 P-4 (Task-340, Q-3): owners are verdict_only — reads + the
    # verdict face only, no Bash, no file writes (SS-14 AC-6 structural).
    posture: verdict_only
    dependsOn:
      - debate_trigger
    cohort: owner_debate
    join: all
  - id: owner_2
    run: delegate
    lifecycle: spawn
    behavior: agent.delegate
    workloadClass: high_reasoning
    agent: agents/owner.md
    # CP-62 P-4 (Task-340, Q-3): verdict_only (no Bash, no writes).
    posture: verdict_only
    dependsOn:
      - debate_trigger
    cohort: owner_debate
    join: all
  - id: debate_synthesis
    run: inline
    lifecycle: reinvoke
    behavior: hub.inline
    agent: agents/synthesizer.md
    join: all
edges:
  - from: debate_trigger
    to: owner_1
    when: done
    kind: forward
  - from: debate_trigger
    to: owner_2
    when: done
    kind: forward
  - from: owner_1
    to: debate_synthesis
    when: done
    kind: forward
  - from: owner_2
    to: debate_synthesis
    when: done
    kind: forward
  - from: debate_synthesis
    to: debate_trigger
    when: continue
    kind: back
  - from: debate_synthesis
    to: done
    when: done
    kind: forward
  - from: debate_synthesis
    to: ask_user
    when: escalate
    kind: forward
