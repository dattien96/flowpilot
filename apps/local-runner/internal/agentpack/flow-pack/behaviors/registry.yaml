id: builtin-behavior-registry
version: 1
kind: reference_registry
description: Reference-only for DEV - catalog of built-in FlowPilot behavior IDs. This file documents the runtime contract exposed by Go handlers; it is not yet loaded directly by the pack parser.
sourceOfTruth:
  runtimeRegistry: apps/local-runner/internal/runner/behavior_registry_builtin.go
  behaviorTypes: apps/local-runner/internal/runner/behavior_registry.go
notes:
  - Pack YAML may select only behavior IDs that the Go behavior registry knows how to resolve.
  - This file is documentation for humans and tooling; changing it alone does not add runtime support.
behaviors:
  - id: agent.delegate
    scope: delegate
    aliases:
      - coding
      - implementation
      - code
    purpose: Prepare and hand off a prompt to a provider-backed child or flow node.
    runtimeHandler: behaviorAgentDelegate
    aiRole:
      sees:
        - The prompt assembled by the runner for the node.
        - Any prepended context, join note, or retry note the runner injected upstream.
      does:
        - Performs the actual model reasoning and generates the node's natural-language/code result.
      doesNotDo:
        - Does not select or execute the Go handler.
        - Does not create the provider turn directly.
    goRuntime:
      inputs:
        - BehaviorInput.Prompt
      does:
        - Validates that the node prompt is non-empty.
        - Returns the prompt as NextPromptFragments for the provider-backed turn.
        - Leaves actual spawn, provider dispatch, wait handling, and persistence to runner orchestration.
      usesExistingLogic:
        - Shared spawnChildRun and startTurn paths
        - Normal provider adapter flow for Codex or Claude
      doesNotDo:
        - No provider call inside the handler itself.
        - No automatic state transition beyond returning continue with prompt fragments.
    usedBy:
      - flows/review-loop.yaml#coder
      - flows/review-loop.yaml#reviewer_correctness
      - flows/review-loop.yaml#reviewer_security
      - flows/rag-harness.yaml#reviewer

  - id: agent.code
    scope: delegate
    aliases: []
    purpose: Write production code under a frozen preflight contract (CP-55 writer).
    runtimeHandler: behaviorAgentDelegate
    aiRole:
      sees:
        - The rendered Flow Context Package plus the frozen contract's intent.
        - The node's own static promptTemplate (e.g. test-signatures /
          implement-complete-tests instructions) appended by the runner.
      does:
        - Performs the actual model reasoning and writes the scoped change.
      doesNotDo:
        - Does not select or execute the Go handler.
        - Does not decide flow state; scope is enforced by the frozen contract gate.
    goRuntime:
      inputs:
        - BehaviorInput.Prompt
      does:
        - Spawns the node's agent as a child run bound to the frozen contract.
        - Enforces declared-path scope at the gate (GetFrozenForStep).
      usesExistingLogic:
        - spawnFrozenWriterChild (flow_validate_audit_dispatch.go)
        - Frozen gate pass in gate_hook.go
      doesNotDo:
        - No provider call inside the handler itself.
    usedBy:
      - flows/rag-harness.yaml#test_signatures
      - flows/rag-harness.yaml#implement

  - id: agent.reproduce
    scope: delegate
    aliases:
      - reproduce
      - reproducing_test
    purpose: Write a single new test that physically reproduces a reported bug (RED on its assertion) before production code may change.
    runtimeHandler: behaviorAgentDelegate
    notes:
      - CP-64 P-2/P-3 (reproduce-first-gate). Reference-only documentation — the
        runtime contract is behavior_registry_builtin.go.
      - The runner's gate hook activates the r-reproduce rule on this behavior
        and suppresses r-tests/r-reg for that one turn (the test is MEANT to be
        red). A passing or non-compiling test is rejected with a reprompt.
      - After the gate passes, the written test file is recorded in the coder
        step's frozen contract as read_only_paths and silent-denied at the
        shared approval bridge, so the coder cannot weaken it.
    aiRole:
      sees:
        - The bug report / stack trace / frozen contract intent and the flow context package.
        - The node's static promptTemplate (prompts/reproduce-failing-test.md).
      does:
        - Writes ONE new test file with complete assertions and runs it.
      doesNotDo:
        - Does not fix the bug and does not touch production code.
        - Does not fill, weaken, or edit pre-existing tests.
    goRuntime:
      inputs:
        - BehaviorInput.Prompt
      does:
        - Reuses behaviorAgentDelegate verbatim (no new spawn path).
        - Spawns the node's agent (agents/reproducer.md) as a child run.
      usesExistingLogic:
        - spawnChildRun / tryAdvanceFlowFromNode generic delegate path
        - r-reproduce rule evaluation in gate_hook.go (runChildArtifactOutputGate)
      doesNotDo:
        - No provider call inside the handler itself.
        - No frozen preflight writer binding (this is not an agent.code node).
    runtimeEffects:
      - Gate pass requires a compiled suite with at least one failing test.
      - Gate pass locks the reproduction test file read-only for the coder step.
    usedBy:
      - flows/bug-harness.yaml#reproduce_test
      - flows/bug-plan-harness.yaml#reproduce_test

  - id: agent.scaffold
    scope: delegate
    aliases:
      - scaffold
      - scaffold_tdd
    purpose: Design the API contract as signature-only production stubs plus a fully executable RED test suite (Contract-First Scaffold TDD).
    runtimeHandler: behaviorAgentDelegate
    notes:
      - CP-67 P-3 (Task-380). Reference-only documentation — the runtime
        contract is behavior_registry_builtin.go.
      - A frozen-contract writer like agent.code (stubs live in the
        freeze-dominated DeclaredPaths; new test files are scope-drift
        exempt like the reproduce test file).
      - The runner's gate hook arms r-scaffold-red on this behavior and
        suppresses r-tests/r-reg for that one turn (the suite is MEANT to
        be red). Compile failure or an all-green suite is rejected with a
        reprompt; CP-67 B-11 additionally validates every stub body
        against the static stub whitelist.
      - After the gate passes, the test files are locked read-only and the
        canonical SignatureHash + LockedSignatures are snapshotted into the
        frozen contract (single-write LockScaffoldArtifacts), so the coder
        can only fill bodies.
    aiRole:
      sees:
        - The frozen contract intent / task plan and the flow context package.
        - The node's static promptTemplate (prompts/scaffold-contract-tdd.md).
      does:
        - Creates signature-complete production stubs with empty bodies.
        - Writes the full executable red test suite and runs it.
        - Calls submit_scaffold_outcome with the typed handover.
      doesNotDo:
        - Does not implement business logic inside the stubs.
        - Does not weaken or skip tests to make the scaffold pass.
    goRuntime:
      inputs:
        - BehaviorInput.Prompt
      does:
        - Reuses behaviorAgentDelegate verbatim (no new spawn path).
        - Spawns the node's agent (agents/scaffold-architect.md) as a child run.
      usesExistingLogic:
        - spawnChildRun / tryAdvanceFlowFromNode generic delegate path
        - r-scaffold-red evaluation + LockScaffoldArtifacts in gate_hook.go
      doesNotDo:
        - No provider call inside the handler itself.
    runtimeEffects:
      - Gate pass requires a compiling suite with at least one failing test
        and every stub body inside the static whitelist.
      - Gate pass locks the test files read-only and snapshots SignatureHash
        for the coder step.
    usedBy:
      - flows/task-harness.yaml#test_signatures
      - flows/vibe-sprint.yaml#tdd

  - id: tournament.arbiter
    scope: inline
    purpose: Score finished candidates deterministically (50% tests + 30% LSP + 20% blast radius) and return the merge/retry/ask verdict for the tournament round.
    runtimeHandler: behaviorTournamentArbiter
    notes:
      - CP-65 P-3 (Task-370). Reference-only documentation — the runtime
        contract is runner/tournament_behavior.go.
      - Never calls a provider; scoring delegates to tournament.TournamentArbiter.
      - Verdict-time cleanup: winner path deletes losers now; every other
        verdict deletes all worktrees (no-orphan policy, evidence in payload).
    aiRole:
      sees:
        - Candidate worktrees and their collected metrics (suite/LSP/dependents).
        - The flow node config (candidates, auto_pick, max_attempts, serial).
      does:
        - Runs the baseline suite once, collects per-candidate metrics, decides.
      doesNotDo:
        - Does not run candidates and does not merge anything.
    goRuntime:
      inputs:
        - BehaviorInput.RawArgs.config
        - BehaviorInput.RawArgs.attempt
        - BehaviorInput.WorkspaceCwd
      does:
        - Ensures candidate worktrees, collects metrics, calls Arbiter.Decide.
        - Returns Status done (merge) / retry (back-edge) / escalate (ask_user).
      usesExistingLogic:
        - tournament.WorktreeManager (Create/Cleanup)
        - tournament.TournamentArbiter.Decide + DecideTournamentAction
      doesNotDo:
        - No provider call inside the handler itself.
    usedBy:
      - flows/tournament-harness.yaml#tournament_arbiter

  - id: tournament.merge
    scope: inline
    purpose: Apply the winner patch onto the main workspace and clean up; escalate with patch evidence on conflict.
    runtimeHandler: behaviorTournamentMerge
    notes:
      - CP-65 P-3 (Task-370). Reference-only documentation — the runtime
        contract is runner/tournament_behavior.go.
      - Creates no commit and touches no branch/ref; conflict escalates with
        patch + paths in the payload after cleanup (no kept worktree).
    aiRole:
      sees:
        - The arbiter verdict winner id.
      does:
        - Merges the winner and emits an audit-draft-shaped summary.
      doesNotDo:
        - Does not pick winners and does not auto-resolve conflicts.
    goRuntime:
      inputs:
        - BehaviorInput.RawArgs.winner
        - BehaviorInput.WorkspaceCwd
      does:
        - Calls WorktreeManager.MergeWinner, then Cleanup for the winner.
      usesExistingLogic:
        - tournament.WorktreeManager (MergeWinner/Cleanup)
      doesNotDo:
        - No provider call inside the handler itself.
    usedBy:
      - flows/tournament-harness.yaml#merge_and_audit

  - id: hub.inline
    scope: inline
    aliases:
      - hub.synthesize
    purpose: Run deterministic hub-side synthesis or default continue behavior without spawning a child agent.
    runtimeHandler: behaviorHubInline
    aiRole:
      sees:
        - Joined child results and any hub reinvoke prompt.
      does:
        - Usually acts as the hub or synthesizer turn that decides whether to approve, continue, or block.
      doesNotDo:
        - Does not mutate loop state by prose alone; that still requires a control tool call.
    goRuntime:
      inputs:
        - BehaviorInput.RawArgs
      does:
        - If raw args already look like generic flow control, forwards to flow.control behavior.
        - Otherwise returns continue by default.
      usesExistingLogic:
        - behaviorFlowControl for structured control payloads
      doesNotDo:
        - No provider spawn.
        - No direct applyFlowControl call from this handler alone.
    usedBy:
      - flows/review-loop.yaml#synthesis
      - flows/rag-harness.yaml#synthesis

  - id: context.produce
    scope: inline
    aliases:
      - context.deterministic_feature_package
      - context.deterministic_feature_context
      - plan
      - planning
      - design
    purpose: Build the deterministic Flow Context Package from feature catalog, change history, chat summary, and source excerpts.
    runtimeHandler: behaviorContextProduce
    aiRole:
      sees:
        - Nothing directly from this handler, because it is an inline Go-owned behavior.
      does:
        - The model does not assemble the package.
      doesNotDo:
        - No retrieval, ranking, or summarization by AI inside this behavior.
    goRuntime:
      inputs:
        - BehaviorInput.WorkflowRunID
        - BehaviorInput.StepRunID
        - BehaviorInput.Prompt
        - optional payload.sourceDocId
        - workspace cwd
      does:
        - Calls BuildFlowContextPackage.
        - Resolves feature key via feature catalog.
        - Loads change history from the change ledger.
        - Loads prior discussion from the chat summary ledger.
        - Reads bounded workspace-safe source excerpts.
        - Emits payload.package for downstream context.render or delegate nodes.
      usesExistingLogic:
        - featurecatalog.ResolveFeature and TopCandidate scoring
        - changeledger history slot loading
        - chat summary slot loading
        - workspace-safe excerpt reader with caps and symlink protection
      doesNotDo:
        - No vector search.
        - No embeddings.
        - No git diff walk inside this handler by default.
        - No AI summarization step.
    runtimeEffects:
      - Produces payload.package of type FlowContextPackage.
      - Uses deterministic CP-41 context assembly logic already implemented in Go.
    usedBy:
      - flows/rag-harness.yaml#context

  - id: context.render
    scope: inline
    aliases:
      - context.prompt_handoff
    purpose: Render a Flow Context Package into a coding prompt handoff.
    runtimeHandler: behaviorContextRender
    aiRole:
      sees:
        - The final rendered handoff prompt after Go prepends the Flow Context Package.
      does:
        - Consumes the rendered package as context during the downstream delegate turn.
      doesNotDo:
        - Does not choose the rendering format itself.
    goRuntime:
      inputs:
        - payload.package
        - prompt
      does:
        - Calls ComposeFlowCodingPrompt to prepend the rendered Flow Context Package and usage instructions.
        - Returns prompt fragments for downstream provider execution.
      usesExistingLogic:
        - RenderFlowContextPackage
        - ComposeFlowCodingPrompt
      doesNotDo:
        - No provider call.
        - No package reconstruction if one is already available.
    runtimeEffects:
      - Requires payload.package.
      - Returns rendered prompt fragments for downstream delegate execution.
    usedBy:
      - Flow context handoff paths in runner code

  - id: command.validate
    scope: inline
    aliases:
      - validation.command
    purpose: Convert command/validation exit status into generic flow-control semantics.
    runtimeHandler: behaviorCommandValidate
    aiRole:
      sees:
        - Usually only the follow-up prompt or summary produced after validation, not this internal mapping step.
      does:
        - The model does not map exit codes itself here.
    goRuntime:
      inputs:
        - RawArgs.exitCode
        - any other RawArgs validation payload
      does:
        - Coerces numeric exitCode safely from JSON or Go caller shapes.
        - Returns done when exitCode is 0.
        - Returns continue with the raw payload when exitCode is nonzero.
      usesExistingLogic:
        - Shared toIntArg conversion helper
      doesNotDo:
        - No shell command execution in this handler by itself.
        - No retries by itself; only emits the signal for orchestration to consume.
    runtimeEffects:
      - exitCode 0 -> done
      - nonzero exitCode -> continue
      - passes raw validation payload downstream
    usedBy:
      - flows/rag-harness.yaml#validate

  - id: validation.summarize
    scope: inline
    aliases: []
    purpose: Reduce a list of issues into a done-or-continue flow decision.
    runtimeHandler: behaviorValidationSummarize
    aiRole:
      sees:
        - Usually the downstream prompt built from summarized issues.
      does:
        - The model does not count issues here; Go does.
    goRuntime:
      inputs:
        - RawArgs.issues
      does:
        - Counts issues across JSON-decoded and typed Go slice shapes.
        - Returns done when issue count is zero.
        - Returns continue and re-emits issues payload when count is nonzero.
      usesExistingLogic:
        - Shared issuesLen helper tolerant of []any and typed slices
      doesNotDo:
        - No semantic deduplication or reasoning over the issue content.
    runtimeEffects:
      - no issues -> done
      - one or more issues -> continue
    usedBy:
      - Generic validation summarization paths

  - id: artifact.audit_draft
    scope: inline
    aliases:
      - audit.draft
    purpose: Prepare an audit draft artifact summary without committing it.
    runtimeHandler: behaviorArtifactAuditDraft
    aiRole:
      sees:
        - Usually the resulting draft prompt or confirmation step after the draft is prepared.
      does:
        - May author the summary upstream, but does not commit the audit through this behavior.
    goRuntime:
      inputs:
        - RawArgs.summary
      does:
        - Validates that a non-empty summary exists.
        - Produces draftSummary payload for a later confirmation or write step.
      usesExistingLogic:
        - Generic draft gating contract
      doesNotDo:
        - No artifact write.
        - No user confirmation.
    runtimeEffects:
      - Requires a summary input.
      - Produces draftSummary payload.
      - Does not write an artifact by itself.
    usedBy:
      - flows/rag-harness.yaml#audit

  - id: telegram.notify
    scope: inline
    aliases:
      - notify.telegram
    purpose: Send a bound telegram.v1 OUTPUT message deterministically, with no AI turn.
    runtimeHandler: behaviorTelegramNotify
    aiRole:
      sees:
        - Nothing; no provider turn runs for this node.
      does:
        - Nothing — the message text is the artifact's own Message Template, or a fixed default summary.
    goRuntime:
      inputs:
        - node.ArtifactBindings (telegram.v1 OUTPUT, chatId + optional messageTemplate)
      does:
        - Sends via executeTelegramLoopbackSend (resolves the connected bot credential, honors auto-approve).
        - Verifies a real message_id before following the forward "done" edge.
        - Escalates (ask_user) instead of settling done when the send did not complete.
      usesExistingLogic:
        - executeTelegramLoopbackSend (telegram_loopback.go)
      doesNotDo:
        - No AI composition of the message.
        - No template variable substitution (Message Template is sent verbatim).
    usedBy:
      - Any flow node bound to a telegram.v1 OUTPUT artifact where a fixed/templated message is enough.

  - id: hub.notify
    scope: inline
    aliases:
      - notify.hub
    purpose: Reinvoke the SAME hub/main agent session for one more turn to compose and send a notification, with no child agent spawned.
    runtimeHandler: behaviorHubNotify
    aiRole:
      sees:
        - A write-contract prompt (telegram.v1 OUTPUT target + optional Message Template, when bound) plus an instruction to call the flow's control tool with status=done when finished.
      does:
        - Composes the notification (e.g. fills the Message Template's free-text/variable parts) and calls send_message itself, then calls the flow control tool.
      doesNotDo:
        - Does not spawn a child agent — this IS the hub's own next turn.
    goRuntime:
      inputs:
        - node (for its telegram.v1 OUTPUT binding, if any)
      does:
        - Marks node as the run's active hub node so its own later "done" resolves against its own forward edge.
        - Reinvokes the hub session (maybeAutoReinvokeHubWithPrompt) with composeHubNotifyPrompt's prompt.
      usesExistingLogic:
        - The same hub-reinvoke mechanism (scheduleChildTurn) hub.inline/synthesis already uses — no new agent-spawn path.
      doesNotDo:
        - No provider call inside the handler itself; the reinvoked turn is a normal hub turn.
    runtimeEffects:
      - Leaves the flow loop running (not settled) until the reinvoked turn calls flow_control("done").
    usedBy:
      - A node placed after synthesis (or any other node) when the message should be AI-composed from a template, without the token/session cost of a fresh child agent.

  - id: flow.control
    scope: control
    aliases:
      - flow.control_tool
    purpose: Consume generic continue/done/escalate control signals for the flow engine.
    runtimeHandler: behaviorFlowControl
    aiRole:
      sees:
        - Usually not directly. AI more often sees a declared face such as submit_review_outcome instead of bare flow.control.
      does:
        - May indirectly cause this behavior by calling a declared tool face that maps onto it.
    goRuntime:
      inputs:
        - RawArgs shaped like FlowControlInput
      does:
        - Validates generic status values continue, done, or escalate.
        - Returns normalized status, summary, and payload for applyFlowControl.
        - Downstream orchestration then mutates loop state, reinvokes nodes, or blocks for user input.
      usesExistingLogic:
        - parseFlowControlInput
        - applyFlowControl in InteractiveService
      doesNotDo:
        - No direct loop mutation inside this handler alone.
        - No provider interaction.
    runtimeEffects:
      - Validates generic status values.
      - Produces normalized status, summary, and payload for applyFlowControl.
    usedBy:
      - Declared tool faces such as tools/submit-review-outcome.yaml

  - id: user.confirm
    scope: control
    aliases: []
    purpose: Gate a pending draft or step on explicit user confirmation.
    runtimeHandler: behaviorUserConfirm
    aiRole:
      sees:
        - Usually a follow-up question or pending confirmation state.
      does:
        - Can ask for confirmation, but cannot fabricate confirmation through this behavior.
    goRuntime:
      inputs:
        - RawArgs.confirmed
      does:
        - Returns done only when confirmed is explicitly true.
        - Otherwise keeps the node open with continue.
      usesExistingLogic:
        - Generic control behavior contract
      doesNotDo:
        - No automatic approval.
        - No side effects except emitting the status.
    runtimeEffects:
      - confirmed=true -> done
      - otherwise -> continue
    usedBy:
      - Future or generic confirmation-gated flows
