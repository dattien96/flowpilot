<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>FlowPilot Desktop</title>
  </head>
  <body>
    <div id="root">
      <!-- Pre-React splash: pure markup/CSS so the window never paints a dead
           empty screen while the bundle loads. Replaced by the first render. -->
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-splash-spinner"></div>
        <div class="boot-splash-title">FlowPilot</div>
        <div class="boot-splash-sub">Preparing desktop workspace…</div>
      </div>
    </div>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141414;
      }
      .boot-splash {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: rgba(255, 255, 255, 0.85);
      }
      .boot-splash-spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(73, 176, 255, 0.9);
        border-top-color: transparent;
        animation: boot-splash-spin 0.8s linear infinite;
      }
      .boot-splash-title {
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .boot-splash-sub {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.45);
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
