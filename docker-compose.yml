services:
  local-runner:
    build:
      context: .
      dockerfile: apps/local-runner/Dockerfile.dev
    working_dir: /workspace/apps/local-runner
    environment:
      FLOWPILOT_WORKSPACE: /workspace
    ports:
      - "4317:4317"
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - ${USERPROFILE}/.codex:/root/.codex

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile.dev
    depends_on:
      - local-runner
    working_dir: /workspace/apps/admin-web
    environment:
      FLOWPILOT_RUNNER_URL: http://local-runner:4317
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - .:/workspace
      - admin-web-node-modules:/workspace/apps/admin-web/node_modules
    command: npm run dev -- --hostname 0.0.0.0 --port 3001

volumes:
  admin-web-node-modules:
  go-mod-cache:
  go-build-cache:
